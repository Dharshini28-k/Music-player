<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player">

        <div class="header">
            <h1>🎵 Music Player</h1>
            <p>Enjoy your favorite music</p>
        </div>

        <div class="now-playing">
            <div class="music-icon">🎵</div>

            <h2 id="currentSong">No song selected</h2>
            <p id="status">Select a song to start playing</p>
        </div>

        <div class="progress-container">
            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">0:00</span>
        </div>

        <div class="volume-container">
            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >
        </div>

        <div class="controls">

            <button id="previousBtn" title="Previous">
                ⏮
            </button>

            <button id="playBtn" class="play-btn" title="Play">
                ▶
            </button>

            <button id="pauseBtn" title="Pause">
                ⏸
            </button>

            <button id="stopBtn" title="Stop">
                ⏹
            </button>

            <button id="nextBtn" title="Next">
                ⏭
            </button>

        </div>

        <div class="file-section">

            <label for="fileInput" class="open-btn">
                📂 Open Music
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".mp3,.wav,audio/mpeg,audio/wav"
                multiple
            >

        </div>

        <div class="playlist-section">

            <h3>🎶 Playlist</h3>

            <ul id="playlist">
                <li class="empty">
                    No songs added
                </li>
            </ul>

        </div>

        <audio id="audioPlayer"></audio>

    </div>

    <script src="script.js"></script>

</body>
</html>
